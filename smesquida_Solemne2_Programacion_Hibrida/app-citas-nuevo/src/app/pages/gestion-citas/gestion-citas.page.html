<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión de citas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <ion-card>
    <ion-card-header>
      <ion-card-title style="font-size: 16px; font-weight: bold;">Crea una nueva cita</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      
      <ion-item>
        <ion-textarea 
          [value]="titulo" 
          (ionInput)="titulo = $event.detail.value!" 
          placeholder="Cita (Mínimo 5 caracteres)">
        </ion-textarea>
      </ion-item>

      <ion-item class="ion-margin-top">
        <ion-input 
          [value]="autor" 
          (ionInput)="autor = $event.detail.value!" 
          placeholder="Autor (Mínimo 2 caracteres)">
        </ion-input>
      </ion-item>

      <ion-button fill="clear" (click)="agregarCita()" class="ion-margin-top" style="text-transform: none; font-weight: bold;">
        AGREGAR +
      </ion-button>

    </ion-card-content>
  </ion-card>

  <!-- Lista de citas ingresadas -->
  <ion-list class="ion-margin-top">
    <ion-item *ngFor="let cita of citas">
      <ion-label class="ion-text-wrap">
        <p style="color: black; font-size: 14px;">{{ cita.titulo }}</p>
        <p style="text-align: right; font-size: 12px; color: gray;" *ngIf="cita.autor">{{ cita.autor }}</p>
      </ion-label>
      <ion-button slot="end" fill="clear" color="primary" *ngIf="permitirBorrar" (click)="eliminarCita(cita.id)">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

</ion-content>
